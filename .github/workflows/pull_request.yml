name: PR Pipeline

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

jobs:
  agent-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: VitoorFranca/pr-analysis@master
        with:
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-sonnet-4-6
          typesafe-api-key: ${{ secrets.TYPESAFE_API_KEY }}
          ignore-paths: |
            package-lock.json
            yarn.lock
            pnpm-lock.yaml
            next-env.d.ts
            *.min.js
            *.map
            __snapshots__/
            *.snap
            public/**/*.png
            public/**/*.jpg
            public/**/*.webp
            public/**/*.ico
            public/**/*.woff2